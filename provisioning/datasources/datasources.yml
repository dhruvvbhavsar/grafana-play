apiVersion: 1

datasources:
  - name: HIS-AAROGYAHUB PostgreSQL
    uid: his-qa-postgres
    type: postgres
    access: proxy
    url: $__env{HIS_AAROGYAHUB_DB1_HOST}
    user: $__env{HIS_AAROGYAHUB_DB1_USER}
    database: $__env{HIS_AAROGYAHUB_DB1_NAME}
    isDefault: true
    secureJsonData:
      password: $__env{HIS_AAROGYAHUB_DB1_PASSWORD}
    jsonData:
      database: $__env{HIS_AAROGYAHUB_DB1_NAME}
      postgresVersion: 1600
      sslmode: $__env{HIS_AAROGYAHUB_DB1_SSLMODE}
      timescaledb: false
    editable: true
