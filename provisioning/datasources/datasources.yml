apiVersion: 1

datasources:
  - name: HIS-QA PostgreSQL
    uid: his-qa-postgres
    type: postgres
    access: proxy
    url: $__env{HIS_QA_DB_HOST}
    user: $__env{HIS_QA_DB_USER}
    database: $__env{HIS_QA_DB_NAME}
    isDefault: true
    secureJsonData:
      password: $__env{HIS_QA_DB_PASSWORD}
    jsonData:
      database: $__env{HIS_QA_DB_NAME}
      postgresVersion: 1600
      sslmode: $__env{HIS_QA_DB_SSLMODE}
      timescaledb: false
    editable: true
